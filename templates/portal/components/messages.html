{% if messages %}
<div class="mb-4" aria-live="polite">
    {% for message in messages %}
    <div
        class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show"
        role="alert"
    >
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
